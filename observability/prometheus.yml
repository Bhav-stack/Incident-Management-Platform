# Prometheus scrape config for the Aegis stack.
#
# The Spring services run on the host (`gradle bootRun`), so Prometheus (in a
# container) scrapes them via host.docker.internal. On Linux Docker engines
# without host-gateway support, set extra_hosts: ["host.docker.internal:host-gateway"]
# on the prometheus service.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: simulator
    static_configs:
      - targets: ["host.docker.internal:8080"]

  - job_name: ingest-svc
    static_configs:
      - targets: ["host.docker.internal:8081"]

  - job_name: incident-svc
    static_configs:
      - targets: ["host.docker.internal:8082"]