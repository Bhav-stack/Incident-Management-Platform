# Serves the dashboard bundle and proxies API + WebSocket (SockJS) traffic to
# incident-svc.
#
# This file is copied into /etc/nginx/templates/default.conf.template by
# deploy/Dockerfile.dashboard, so the nginx entrypoint substitutes
# ${AEGIS_API_KEY} at container start. Only that one variable is templated on
# purpose: nginx does not expand shell-style defaults such as
# ${VAR:-fallback}, and an unexpanded placeholder makes the container refuse
# to start. The upstream host is therefore a plain name, correct for any
# network where the dashboard and the service are both containers.
#
# The API key lives here, on the server, never in the browser: the proxy adds
# the header to every /api request it forwards. Leave AEGIS_API_KEY empty when
# the services run with authentication disabled; the empty header is then
# ignored, and it is rejected with 401 the moment a key is configured.
upstream incident_svc {
    server incident-svc:8082;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://incident_svc;
        proxy_set_header Host $host;
        proxy_set_header X-API-Key "${AEGIS_API_KEY}";
    }

    # SockJS needs the upgrade headers for the WebSocket transport and
    # long timeouts for the XHR fallback.
    location /ws/ {
        proxy_pass http://incident_svc;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri /index.html;
    }
}
