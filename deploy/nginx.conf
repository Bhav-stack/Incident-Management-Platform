# Serves the dashboard bundle and proxies API + WebSocket (SockJS) traffic
# to incident-svc. INCIDENT_SVC is replaced at deploy time (envsubst) or set
# as the upstream host.
upstream incident_svc {
    server ${INCIDENT_SVC:-incident-svc:8082};
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://incident_svc;
        proxy_set_header Host $host;
    }

    # SockJS needs the upgrade headers for the WebSocket transport and
    # long-ish timeouts for the XHR fallback.
    location /ws/ {
        proxy_pass http://incident_svc;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri /index.html;
    }
}