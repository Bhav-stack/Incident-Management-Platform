spring:
  application:
    name: incident-svc
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: incident
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: manual
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        acks: all
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:aegis}
    username: ${POSTGRES_USER:aegis}
    password: ${POSTGRES_PASSWORD:aegis}
  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway, never by Hibernate
    open-in-view: false
  flyway:
    enabled: true

# Agent layer (Phase 4). mode=rule runs the deterministic proposer;
# mode=agent runs the tool-calling loop. fake=true uses the scripted LLM
# (CI and demos without an API key).
agent:
  mode: ${AGENT_MODE:rule}
  model: ${AGENT_MODEL:gpt-4o-mini}
  api-key: ${OPENAI_API_KEY:}
  base-url: ${AGENT_BASE_URL:https://api.openai.com/v1}
  fake: ${AGENT_FAKE_LLM:false}
  max-rounds: 8
  temperature: 0.1

# Autonomy policy (Phase 5a): thresholds between proposal and action.
# Runtime toggles (shadow mode, LOW auto-approve) live in Redis and can be
# flipped from the dashboard Controls view.
policy:
  confidence-minimums:
    clear_cache: 0.70
    restart_instance: 0.70
    scale_replicas: 0.80
    rollback_deploy: 0.90
    kill_instance: 0.90
  min-evidence-signals: 2
  auto-approve-low: false
  # Risk levels that need two distinct verified operators to approve. The
  # requirement is captured on the proposal when it is created, so relaxing
  # this later cannot retroactively weaken a decision already taken.
  two-person-levels: HIGH

# Replay harness ground truth (Phase 5b): demo scenarios the shadow
# evaluator scores the proposer against. no_action is the negative class.
replay:
  scenarios:
    - {service: checkout-service, signal: error_rate, expected-action: restart_instance}
    - {service: payment-service, signal: cpu_saturation, expected-action: scale_replicas}
    - {service: search-service, signal: deploy_regression, expected-action: rollback_deploy}
    - {service: inventory-service, signal: cache_stampede, expected-action: clear_cache}
    - {service: auth-service, signal: error_rate, expected-action: restart_instance}
    - {service: catalog-service, signal: error_rate, expected-action: no_action}

# Services the Controls view can toggle individually.
controls:
  services: checkout-service,payment-service,search-service,auth-service,inventory-service

# Approval gate tuning
proposal:
  ttl: 5m              # approval window; expiry escalates, never auto-approves
  sweep-interval: 30s

# Control-plane authentication. Every /api request must present a credential
# when this is set; with nothing configured the filter is disabled (local dev
# and tests) and logs a startup warning. The same api-key value is sent to the
# simulator.
#
# api-key is the shared secret the dashboard proxy holds. Each entry under
# operators is a per-person credential: a request carrying one in
# X-Operator-Key is attributed to that name, which is what makes an approval
# attributable and what the two-person rule counts. Without at least two
# operators configured, HIGH-risk actions cannot be approved at all, by design.
#
# oidc decides where bearer tokens come from. Set issuer-uri to validate tokens
# from a real provider (OIDC discovery + JWKS); alternatively set
# self-issued-secret and the service mints its own short-lived operator tokens
# at POST /api/auth/session, which is what the dashboard uses to sign an
# approval as a person. With neither set, tokens are refused and only keys
# authenticate.
aegis:
  security:
    api-key: ${AEGIS_API_KEY:}
    default-operator: ${AEGIS_OPERATOR_NAME:operator}
    operators:
      - name: ${AEGIS_OPERATOR_1_NAME:oncall-primary}
        key: ${AEGIS_OPERATOR_1_KEY:}
      - name: ${AEGIS_OPERATOR_2_NAME:oncall-secondary}
        key: ${AEGIS_OPERATOR_2_KEY:}
    # The incident feed needs a fresh single-use ticket in the STOMP CONNECT
    # frame. Tickets are issued by POST /api/ws-ticket through the proxy, so
    # the browser never holds the API key.
    ws-require-ticket: ${AEGIS_WS_REQUIRE_TICKET:true}
    ws-ticket-ttl-seconds: 60
    oidc:
      issuer-uri: ${AEGIS_OIDC_ISSUER_URI:}
      audience: ${AEGIS_OIDC_AUDIENCE:aegis-control-plane}
      # Built-in issuer, for local and demo runs. The issuer must be an
      # absolute http(s) URL: a JWT 'iss' claim is a URL. The secret must be
      # >= 32 bytes for HS256 (`openssl rand -base64 48`); empty turns the
      # built-in issuer off.
      self-issued-issuer: ${AEGIS_JWT_ISSUER:https://aegis.local/control-plane}
      self-issued-secret: ${AEGIS_JWT_SECRET:}
      token-ttl-seconds: ${AEGIS_JWT_TTL_SECONDS:300}
      # Claim that says whether a token's subject is a person. A subject with
      # no such claim counts as one; the built-in issuer sets it to false when
      # it mints a token for the shared client credential.
      attributable-claim: aegis_attributable

# Action execution and verification
simulator:
  base-url: ${SIMULATOR_BASE_URL:http://localhost:8080}
action:
  verify-window: 60s       # how long metrics may take to recover
  verify-poll-interval: 10s
  verify-threshold: 5.0    # must match ingest rule error-rate-threshold
  lock-ttl: 5m

# Observability: the consumer group's lag is sampled from the broker for
# these topics, so the gauge is meaningful even with no active consumer.
metrics:
  kafka-lag-topics: anomalies,action.commands
  kafka-lag-interval: 15s

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus