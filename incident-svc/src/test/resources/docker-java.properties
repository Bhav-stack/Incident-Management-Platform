# docker-java (the client Testcontainers 1.x shades) falls back to API
# version 1.32 when it cannot negotiate. Docker Engine 29 raised its hard
# minimum to 1.40 and answers every older request with HTTP 400, which
# Testcontainers reports as "Could not find a valid Docker environment" and
# the Docker-gated tests then skip silently.
#
# 1.44 sits inside the range every currently supported engine accepts
# (Docker 25.0 and newer). Testcontainers 2.x negotiates the version with the
# daemon and makes this file unnecessary; delete it when you upgrade.
api.version=1.44
