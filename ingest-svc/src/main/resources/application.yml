spring:
  application:
    name: ingest-svc
  task:
    scheduling:
      # The buffer flush runs every second on this scheduler. With the default
      # pool size of one, a slow periodic task (the Kafka lag sampler makes
      # admin calls over the network) delays every flush, which shows up as
      # staleness rather than as an error. Give each periodic task a thread.
      pool:
        size: 4
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ingest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false   # at-least-once: offsets commit only after processing
    listener:
      # Batch listening is what lets dedup pipeline one Redis round trip per
      # poll batch instead of one per event (the measured ingest bottleneck).
      # Manual acks then commit the batch offset only after the whole batch
      # was accepted by the pipeline.
      type: batch
      ack-mode: manual
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true  # no broker-side duplicates on retry
        acks: all
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_INGEST_DB:aegis_ingest}
    username: ${POSTGRES_USER:aegis}
    password: ${POSTGRES_PASSWORD:aegis}
  flyway:
    enabled: true

# Pipeline tuning — config-driven policy, never hard-coded.
ingest:
  dedup-ttl: 1h
  # Consumer parallelism. raw.events is created with this many partitions and
  # the listener runs this many threads; the producer keys by source, so each
  # source stays on one partition and keeps its order.
  consumer:
    partitions: 3
    concurrency: 3
  buffer:
    window: 5s          # hold events so out-of-order siblings arrive
    grace: 15s          # drop events later than window + grace
    flush-interval: 1s
    # Per-source queue cap. It must hold at least one window of traffic per
    # source (window x per-source rate), or the oldest-first trim drops events
    # that were about to become due — which reads as overflow loss even when
    # the flush is keeping up. 5s x 4000/s per source covers this host's head-
    # room with margin; the cap still bounds memory under a runaway producer.
    max-queue-size: 20000
  rule:
    error-rate-threshold: 5.0
    required-streaks: 2 # confirmation window: 2 consecutive breach samples
    signal: error_rate
    severity: SEV2

# Observability: the consumer group's lag is sampled from the broker for
# these topics, so the gauge is meaningful even with no active consumer.
metrics:
  kafka-lag-topics: raw.events
  kafka-lag-interval: 15s

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus